name: Build Clivelle for iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - '*.svg'
      - '*.png'
      - 'package.json'
      - 'capacitor.config.json'
      - 'scripts/**'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

jobs:
  ios-simulator:
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build web assets
        run: npm run build:web

      - name: Generate iOS project
        run: npx cap add ios

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/ios-derived \
            CODE_SIGNING_ALLOWED=NO

      - name: Package simulator app
        run: |
          mkdir -p build/ios-artifact
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios-derived/Build/Products/Debug-iphonesimulator/App.app \
            build/ios-artifact/Clivelle-iOS-Simulator.zip

      - name: Upload iOS Simulator build
        uses: actions/upload-artifact@v4
        with:
          name: clivelle-ios-simulator
          path: build/ios-artifact/Clivelle-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
