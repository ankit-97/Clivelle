name: Backend API checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install system headers for SQL Server driver
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev
      - name: Regenerate lockfile and verify clean install
        run: |
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
      - name: Check PostgreSQL server syntax
        run: node --check src/postgres-server.js
      - name: Run backend tests
        run: npm test
